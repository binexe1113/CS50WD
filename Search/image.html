<!doctype html>
<html lang="en">
    <head>
        <title>Image Search</title>
        <link rel="stylesheet" href="styles.css" />
    </head>
    <body>
        <div class="nav-bar">
            <a href="index.html">Google Search</a>
        </div>

        <div class="main-container">
            <div class="logo">
                <span class="color-blue">G</span><span class="color-red">o</span
                ><span class="color-yellow">o</span
                ><span class="color-blue">g</span
                ><span class="color-green">l</span
                ><span class="color-red">e</span>
                <span class="logo-subtext">Images</span>
            </div>

            <form action="https://www.google.com/search">
                <input type="text" name="q" class="search-bar" />
                <input type="hidden" name="tbm" value="isch" />

                <div class="button-container">
                    <input type="submit" value="Image Search" class="btn" />
                </div>
            </form>
        </div>
    </body>
</html>
