<!doctype html>
<html lang="en">
    <head>
        <title>Search</title>
        <link rel="stylesheet" href="styles.css" />
    </head>
    <body>
        <div class="nav-bar">
            <a href="image.html">Image Search</a>
            <a href="advanced.html">Advanced Search</a>
        </div>

        <div class="main-container">
            <div class="logo">
                <span class="color-blue">G</span><span class="color-red">o</span
                ><span class="color-yellow">o</span
                ><span class="color-blue">g</span
                ><span class="color-green">l</span
                ><span class="color-red">e</span>
            </div>

            <form action="https://www.google.com/search">
                <input type="text" name="q" class="search-bar" />

                <div class="button-container">
                    <input type="submit" value="Google Search" class="btn" />
                    <input
                        type="submit"
                        name="btnI"
                        value="I'm Feeling Lucky"
                        class="btn"
                    />
                </div>
            </form>
        </div>
    </body>
</html>
